name: Huomisen lammitysvertailu sahkopostiin
on:
  schedule:
    # 14:20 Suomessa: kesällä 11:20 UTC, talvella 12:20 UTC.
    - cron: '20 11 * * *'
    - cron: '20 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Laheta vertailu
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python daily_email.py
